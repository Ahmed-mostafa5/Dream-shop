<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dreem Shop - تواصل معنا</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">Dreem Shop</div>
        <nav>
            <a href="index.html">الرئيسية</a>
            <a href="products.html">المنتجات</a>
            <a href="portfolio.html">أعمالنا</a>
            <a href="about.html">من نحن</a>
            <a href="contact.html" aria-current="page">تواصل معنا</a>
        </nav>
    </header>

    <section class="hero">
        <h1>تواصل معنا</h1>
        <p>للاستفسارات أو الطلبات راسلنا من خلال النموذج أدناه.</p>
    </section>

    <section style="max-width:700px;margin:20px auto;">
        <form class="cart" style="background:#fff;">
            <div style="display:flex;flex-direction:column;gap:10px;">
                <input type="text" placeholder="الاسم" style="padding:10px;border-radius:6px;border:1px solid #eee;">
                <input type="email" placeholder="البريد الإلكتروني" style="padding:10px;border-radius:6px;border:1px solid #eee;">
                <textarea placeholder="رسالتك" rows="6" style="padding:10px;border-radius:6px;border:1px solid #eee;"></textarea>
                <button type="button" class="checkout-btn">إرسال</button>
            </div>
        </form>
    </section>

    <footer>
        <p>© 2025 - جميع الحقوق محفوظة</p>
    </footer>

</body>
</html>
